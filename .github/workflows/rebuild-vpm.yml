name: Rebuild VPM Listing

# Publishing a release refreshes the poiyomi/vpm listing so VCC picks up the
# new version. Attach package.json and the com.poiyomi.toon zip before
# publishing; the listing is built from the release assets.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to VPM Listing
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.VPM_REPO_TOKEN }}
          repository: poiyomi/vpm
          event-type: rebuild-listing
